<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilyshark Field Demo — off-grid data over Shelby</title>
<meta name="description" content="Interactive 3D demo: a LILYGO T-Deck running Lilyshark carries an 82-byte Shelby pointer across an off-grid LoRa mesh; a connected gateway resolves it against Shelby blob storage on Aptos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307090C'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23F05AA6' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%2366F05A'/%3E%3C/svg%3E">
<style>
  :root {
    --pink:  #F05AA6;
    --lime:  #66F05A;
    --cyan:  #71D8DF;
    --amber: #F0B429;
    --paper: #F0F4EF;
    --bg:    #07090C;
    --panel: rgba(10, 13, 17, 0.82);
    --rule:  rgba(240, 244, 239, 0.14);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--mono); color: var(--paper); }
  #scene { position: fixed; inset: 0; display: block; }

  .hud { position: fixed; z-index: 10; user-select: none; }
  #brand { top: 18px; left: 20px; display: flex; align-items: center; gap: 14px; }
  #brand img { height: 26px; display: block; }
  #brand .sub {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--cyan); border-left: 1px solid var(--rule); padding-left: 14px;
  }
  #links { top: 18px; right: 20px; display: flex; gap: 10px; }
  #links a, #recbtn, #skipbtn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--paper); text-decoration: none; background: var(--panel);
    border: 1px solid var(--rule); padding: 8px 14px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  #links a:hover, #skipbtn:hover { border-color: var(--cyan); color: var(--cyan); }
  #recbtn { color: var(--pink); }
  #recbtn:hover, #recbtn.on { border-color: var(--pink); }
  #recbtn.on { background: rgba(240, 90, 166, 0.12); }
  #recbtn .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-right: 8px; vertical-align: 1px; }
  #recbtn.on .dot { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  #caption {
    left: 50%; bottom: 64px; transform: translateX(-50%);
    max-width: min(760px, calc(100vw - 48px));
    text-align: center; pointer-events: none;
  }
  #caption .phase {
    display: inline-block; font-size: 10px; letter-spacing: 0.22em; color: var(--pink);
    text-transform: uppercase; margin-bottom: 10px;
  }
  #caption .text {
    font-size: 15px; line-height: 1.65; color: var(--paper);
    background: var(--panel); border: 1px solid var(--rule);
    padding: 14px 22px; opacity: 0; transition: opacity 0.5s;
  }
  #caption .text b { color: var(--lime); font-weight: 600; }
  #caption .text i { color: var(--cyan); font-style: normal; }
  #caption .text em { color: var(--pink); font-style: normal; }
  #caption.show .text { opacity: 1; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 12px; text-align: left; border-top: 1px solid var(--rule); }
  .vs .col { padding: 10px 14px 4px; }
  .vs .col + .col { border-left: 1px solid var(--rule); }
  .vs h4 { font-size: 10px; letter-spacing: 0.18em; margin-bottom: 8px; font-weight: 600; }
  .vs .bad h4 { color: #F0715A; }
  .vs .good h4 { color: var(--lime); }
  .vs ul { list-style: none; }
  .vs li { font-size: 12.5px; line-height: 1.8; color: var(--paper); }
  .vs li span { color: rgba(240,244,239,0.55); }
  .vs .bad li strong { color: #F0715A; font-weight: 600; }
  .vs .good li strong { color: var(--lime); font-weight: 600; }

  #timeline {
    left: 0; right: 0; bottom: 0; height: 3px; background: rgba(240,244,239,0.08); pointer-events: none;
  }
  #timeline .fill { height: 100%; width: 0%; background: var(--pink); transition: width 0.25s linear; }

  #controls { bottom: 18px; right: 20px; display: flex; gap: 10px; }
  #hint {
    bottom: 18px; left: 20px; font-size: 10px; letter-spacing: 0.1em;
    color: rgba(240,244,239,0.45); text-transform: uppercase; pointer-events: none;
  }

  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 5; transition: height 0.6s ease; pointer-events: none; }
  #bartop { top: 0; } #barbot { bottom: 0; }
  body.rec .bar { height: 7vh; }
  body.rec #brand .sub, body.rec #links, body.rec #hint, body.rec #timeline { opacity: 0; transition: opacity 0.4s; }
  body.rec #caption { bottom: calc(7vh + 40px); }

  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 50;
    background: var(--bg); text-align: center; padding: 24px; line-height: 1.7; font-size: 14px;
  }
  #fallback a { color: var(--cyan); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="bar" id="bartop"></div>
<div class="bar" id="barbot"></div>

<div class="hud" id="brand">
  <img src="lilyshark-wordmark-pink.svg" alt="Lilyshark">
  <span class="sub">Field demo · off-grid data over Shelby</span>
</div>

<div class="hud" id="links">
  <a href="https://github.com/maxmoneycash/lilyshark" target="_blank" rel="noopener">GitHub</a>
</div>

<div class="hud" id="caption">
  <span class="phase" id="cap-phase"></span>
  <div class="text" id="cap-text"></div>
</div>

<div class="hud" id="controls">
  <button id="skipbtn" title="Next chapter">Next ▸</button>
  <button id="recbtn" title="Hide interface and play the scripted sequence — screen-record this">
    <span class="dot"></span>Record mode
  </button>
</div>

<div class="hud" id="hint">Drag to orbit · scroll to zoom · scripted camera resumes when idle</div>
<div class="hud" id="timeline"><div class="fill" id="tfill"></div></div>

<div id="fallback">
  <div>
    <p>This demo needs WebGL.</p>
    <p><a href="https://github.com/maxmoneycash/lilyshark">github.com/maxmoneycash/lilyshark</a></p>
  </div>
</div>

<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
