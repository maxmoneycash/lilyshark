<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="archTitle">
  <title id="archTitle">Off-grid data flow: an 82-byte Shelby pointer crosses the LoRa mesh; a gateway moves the full blob over IP to Shelby storage; the Lilyshark webapp reads both.</title>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <defs>
    <marker id="aLime" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#66F05A"/>
    </marker>
    <marker id="aCyan" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#71D8DF"/>
    </marker>
    <marker id="aCyanL" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#71D8DF"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="599" rx="8" fill="#0B0D10" stroke="#252B33"/>

  <!-- header -->
  <text class="sans" x="36" y="42" font-size="17" font-weight="600" letter-spacing="3" fill="#F0F4EF">OFF-GRID DATA FLOW</text>
  <text class="mono" x="36" y="62" font-size="11" fill="#8A93A0">the mesh carries an 82-byte reference &#183; a gateway moves the bytes over IP</text>
  <text class="mono" x="1164" y="42" font-size="10" letter-spacing="2" fill="#F05AA6" text-anchor="end">LILYSHARK &#183; SHELBY POINTER</text>
  <line x1="36" y1="76" x2="1164" y2="76" stroke="#232830" stroke-width="1"/>

  <!-- 1. T-Deck -->
  <rect x="36" y="150" width="168" height="180" rx="6" fill="#F05AA6" fill-opacity="0.05" stroke="#F05AA6" stroke-width="1"/>
  <text class="sans" x="120" y="178" font-size="12.5" font-weight="600" letter-spacing="2" fill="#F0F4EF" text-anchor="middle">T-DECK</text>
  <text class="sans" x="120" y="195" font-size="9" letter-spacing="1.5" fill="#F05AA6" text-anchor="middle">LILYSHARK FIRMWARE</text>
  <line x1="52" y1="206" x2="188" y2="206" stroke="#2A2F38" stroke-width="1"/>
  <text class="mono" x="120" y="228" font-size="10" fill="#A8B2BD" text-anchor="middle">ESP32-S3 &#183; SX1262</text>
  <text class="mono" x="120" y="246" font-size="10" fill="#A8B2BD" text-anchor="middle">captures mesh frames</text>
  <text class="mono" x="120" y="264" font-size="10" fill="#A8B2BD" text-anchor="middle">emits SHLB pointers</text>
  <rect x="76" y="288" width="88" height="20" rx="10" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="120" y="301.5" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OFF-GRID</text>

  <!-- T-Deck -> mesh -->
  <line x1="204" y1="240" x2="230" y2="240" stroke="#66F05A" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#aLime)"/>

  <!-- 2. LoRa mesh cloud -->
  <ellipse cx="392" cy="240" rx="156" ry="102" fill="#66F05A" fill-opacity="0.03" stroke="#66F05A" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="sans" x="392" y="168" font-size="11.5" font-weight="600" letter-spacing="2" fill="#F0F4EF" text-anchor="middle">LORA MESH</text>
  <text class="mono" x="392" y="184" font-size="8.5" fill="#8A93A0" text-anchor="middle">MESHTASTIC &#183; MESHCORE &#183; RETICULUM</text>
  <!-- relay links -->
  <line x1="240" y1="240" x2="294" y2="234" stroke="#3A4048" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="318" y1="233" x2="462" y2="237" stroke="#3A4048" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="312" y1="243" x2="384" y2="287" stroke="#3A4048" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="466" y1="249" x2="401" y2="288" stroke="#3A4048" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="486" y1="238" x2="546" y2="240" stroke="#3A4048" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- relay nodes -->
  <circle cx="306" cy="232" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/>
  <text class="mono" x="306" y="235.5" font-size="8" fill="#66F05A" text-anchor="middle">MT</text>
  <circle cx="392" cy="296" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/>
  <text class="mono" x="392" y="299.5" font-size="8" fill="#66F05A" text-anchor="middle">MC</text>
  <circle cx="474" cy="238" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/>
  <text class="mono" x="474" y="241.5" font-size="8" fill="#66F05A" text-anchor="middle">RN</text>
  <!-- the pointer packet in flight -->
  <rect x="344" y="222" width="94" height="22" rx="4" fill="#F05AA6" fill-opacity="0.15" stroke="#F05AA6" stroke-width="1"/>
  <text class="mono" x="391" y="236.5" font-size="9.5" fill="#F05AA6" text-anchor="middle">SHLB &#183; 82 B</text>
  <!-- mesh annotation -->
  <text class="mono" x="392" y="366" font-size="9.5" fill="#8A93A0" text-anchor="middle">the 82-byte ShelbyPointer rides inside a normal protocol payload</text>
  <text class="mono" x="392" y="382" font-size="9.5" fill="#8A93A0" text-anchor="middle">unmodified nodes forward it untouched</text>

  <!-- mesh -> gateway -->
  <line x1="552" y1="240" x2="594" y2="240" stroke="#66F05A" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#aLime)"/>
  <text class="mono" x="573" y="226" font-size="8.5" fill="#F05AA6" text-anchor="middle">POINTER</text>
  <text class="mono" x="573" y="256" font-size="8.5" fill="#8A93A0" text-anchor="middle">82 B</text>

  <!-- 3. Gateway -->
  <rect x="600" y="158" width="158" height="164" rx="6" fill="#F0F4EF" fill-opacity="0.03" stroke="#8A93A0" stroke-width="1"/>
  <text class="sans" x="679" y="186" font-size="12.5" font-weight="600" letter-spacing="2" fill="#F0F4EF" text-anchor="middle">GATEWAY</text>
  <text class="sans" x="679" y="203" font-size="9" letter-spacing="1.5" fill="#71D8DF" text-anchor="middle">MESH-TO-IP BRIDGE</text>
  <line x1="616" y1="214" x2="742" y2="214" stroke="#2A2F38" stroke-width="1"/>
  <text class="mono" x="679" y="236" font-size="9.5" fill="#A8B2BD" text-anchor="middle">any node with an IP path</text>
  <text class="mono" x="679" y="254" font-size="9.5" fill="#A8B2BD" text-anchor="middle">phone &#183; base station</text>
  <text class="mono" x="679" y="272" font-size="9.5" fill="#A8B2BD" text-anchor="middle">resolves the pointer</text>
  <text class="mono" x="679" y="290" font-size="9.5" fill="#A8B2BD" text-anchor="middle">moves the actual bytes</text>

  <!-- gateway <-> shelby : blob over IP -->
  <rect x="758" y="228" width="72" height="24" fill="#71D8DF" fill-opacity="0.10"/>
  <line x1="763" y1="240" x2="825" y2="240" stroke="#71D8DF" stroke-width="2" marker-start="url(#aCyanL)" marker-end="url(#aCyan)"/>
  <text class="mono" x="794" y="220" font-size="8.5" fill="#71D8DF" text-anchor="middle">IP LINK</text>
  <text class="mono" x="794" y="268" font-size="8.5" fill="#F0F4EF" text-anchor="middle">FULL BLOB</text>
  <text class="mono" x="794" y="281" font-size="8.5" fill="#8A93A0" text-anchor="middle">up to GB</text>

  <!-- 4. Shelby storage -->
  <rect x="830" y="150" width="182" height="180" rx="6" fill="#71D8DF" fill-opacity="0.05" stroke="#71D8DF" stroke-width="1"/>
  <text class="sans" x="921" y="178" font-size="12.5" font-weight="600" letter-spacing="2" fill="#F0F4EF" text-anchor="middle">SHELBY STORAGE</text>
  <text class="sans" x="921" y="195" font-size="9" letter-spacing="1.5" fill="#71D8DF" text-anchor="middle">BUILT ON APTOS</text>
  <line x1="846" y1="206" x2="996" y2="206" stroke="#2A2F38" stroke-width="1"/>
  <text class="mono" x="921" y="228" font-size="9.5" fill="#A8B2BD" text-anchor="middle">content-addressed blobs</text>
  <text class="mono" x="921" y="246" font-size="9.5" fill="#A8B2BD" text-anchor="middle">paid reads &#183; paid writes</text>
  <text class="mono" x="921" y="264" font-size="9.5" fill="#A8B2BD" text-anchor="middle">verifiable commitments</text>
  <rect x="876" y="288" width="90" height="20" rx="10" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="921" y="301.5" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">PERSISTENT</text>

  <!-- shelby -> webapp -->
  <line x1="1016" y1="240" x2="1038" y2="240" stroke="#71D8DF" stroke-width="1" marker-end="url(#aCyan)"/>
  <text class="mono" x="1028" y="258" font-size="8" fill="#8A93A0" text-anchor="middle">reads</text>

  <!-- 5. Webapp -->
  <rect x="1044" y="158" width="120" height="164" rx="6" fill="#F05AA6" fill-opacity="0.05" stroke="#F05AA6" stroke-width="1"/>
  <text class="sans" x="1104" y="186" font-size="12.5" font-weight="600" letter-spacing="2" fill="#F0F4EF" text-anchor="middle">WEBAPP</text>
  <text class="sans" x="1104" y="203" font-size="9" letter-spacing="1.5" fill="#F05AA6" text-anchor="middle">LILYSHARK</text>
  <line x1="1058" y1="214" x2="1150" y2="214" stroke="#2A2F38" stroke-width="1"/>
  <text class="mono" x="1104" y="236" font-size="9" fill="#A8B2BD" text-anchor="middle">capture analysis</text>
  <text class="mono" x="1104" y="253" font-size="9" fill="#A8B2BD" text-anchor="middle">Shelby network</text>
  <text class="mono" x="1104" y="270" font-size="9" fill="#A8B2BD" text-anchor="middle">dashboard</text>

  <!-- measured justification -->
  <rect x="36" y="452" width="620" height="112" rx="6" fill="#F0B429" fill-opacity="0.04" stroke="#F0B429" stroke-width="1"/>
  <text class="sans" x="56" y="478" font-size="10" font-weight="600" letter-spacing="2" fill="#F0B429">WHY A REFERENCE &#8212; MEASURED</text>
  <text class="mono" x="56" y="502" font-size="10.5" fill="#F0F4EF">R = 7.36 TX per delivered message  (Meshtastic discrete-event simulator)</text>
  <text class="mono" x="56" y="522" font-size="10.5" fill="#F0F4EF">reach 68.6% &#8594; 25.8% as node density grows</text>
  <text class="mono" x="56" y="542" font-size="10.5" fill="#F0F4EF">airtime is the scarce resource &#8212; send a reference, not a payload</text>

  <!-- legend -->
  <rect x="688" y="452" width="476" height="112" rx="6" fill="none" stroke="#2A2F38" stroke-width="1"/>
  <text class="sans" x="708" y="478" font-size="10" font-weight="600" letter-spacing="2" fill="#8A93A0">LEGEND</text>
  <line x1="708" y1="497" x2="758" y2="497" stroke="#66F05A" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="mono" x="770" y="500.5" font-size="9.5" fill="#A8B2BD">LoRa RF &#8212; scarce shared airtime</text>
  <line x1="708" y1="519" x2="758" y2="519" stroke="#71D8DF" stroke-width="2"/>
  <text class="mono" x="770" y="522.5" font-size="9.5" fill="#A8B2BD">IP path &#8212; moves the full blob</text>
  <rect x="708" y="534" width="50" height="14" rx="3" fill="#F05AA6" fill-opacity="0.15" stroke="#F05AA6" stroke-width="1"/>
  <text class="mono" x="770" y="544.5" font-size="9.5" fill="#A8B2BD">ShelbyPointer &#8212; 82-byte reference</text>
</svg>
