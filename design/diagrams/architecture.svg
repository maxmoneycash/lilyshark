<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="archTitle" role="img" viewBox="0 0 1200 600"><title id="archTitle">Off-grid data flow: an 82-byte Shelby pointer crosses the LoRa mesh; a gateway moves the full blob over IP to Shelby storage; the Lilyshark webapp reads both.</title><style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><defs><marker id="aLime" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#66F05A" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="aCyan" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4" viewBox="0 0 8 8"><path fill="#71D8DF" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="aCyanL" markerHeight="8" markerWidth="8" orient="auto" refX="1" refY="4" viewBox="0 0 8 8"><path fill="#71D8DF" d="M8,0 L0,4 L8,8 Z"/></marker></defs><rect width="1199" height="599" x=".5" y=".5" fill="#0B0D10" stroke="#252B33" rx="8"/><text x="36" y="42" fill="#F0F4EF" class="sans" font-size="17" font-weight="600" letter-spacing="3">OFF-GRID DATA FLOW</text><text x="36" y="62" fill="#8A93A0" class="mono" font-size="11">the mesh carries an 82-byte reference · a gateway moves the bytes over IP</text><text x="1164" y="42" fill="#F05AA6" class="mono" font-size="10" letter-spacing="2" text-anchor="end">LILYSHARK · SHELBY POINTER</text><line x1="36" x2="1164" y1="76" y2="76" stroke="#232830" stroke-width="1"/><rect width="168" height="180" x="36" y="150" fill="#F05AA6" fill-opacity=".05" stroke="#F05AA6" stroke-width="1" rx="6"/><text x="120" y="178" fill="#F0F4EF" class="sans" font-size="12.5" font-weight="600" letter-spacing="2" text-anchor="middle">T-DECK</text><text x="120" y="195" fill="#F05AA6" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">LILYSHARK FIRMWARE</text><line x1="52" x2="188" y1="206" y2="206" stroke="#2A2F38" stroke-width="1"/><text x="120" y="228" fill="#A8B2BD" class="mono" font-size="10" text-anchor="middle">ESP32-S3 · SX1262</text><text x="120" y="246" fill="#A8B2BD" class="mono" font-size="10" text-anchor="middle">captures mesh frames</text><text x="120" y="264" fill="#A8B2BD" class="mono" font-size="10" text-anchor="middle">emits SHLB pointers</text><rect width="88" height="20" x="76" y="288" fill="none" stroke="#5A6270" stroke-width="1" rx="10"/><text x="120" y="301.5" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OFF-GRID</text><line x1="204" x2="230" y1="240" y2="240" stroke="#66F05A" stroke-dasharray="5 4" stroke-width="1" marker-end="url(#aLime)"/><ellipse cx="392" cy="240" fill="#66F05A" fill-opacity=".03" stroke="#66F05A" stroke-dasharray="2 4" stroke-width="1" rx="156" ry="102"/><text x="392" y="168" fill="#F0F4EF" class="sans" font-size="11.5" font-weight="600" letter-spacing="2" text-anchor="middle">LORA MESH</text><text x="392" y="184" fill="#8A93A0" class="mono" font-size="8.5" text-anchor="middle">MESHTASTIC · MESHCORE · RETICULUM</text><line x1="240" x2="294" y1="240" y2="234" stroke="#3A4048" stroke-dasharray="3 3" stroke-width="1"/><line x1="318" x2="462" y1="233" y2="237" stroke="#3A4048" stroke-dasharray="3 3" stroke-width="1"/><line x1="312" x2="384" y1="243" y2="287" stroke="#3A4048" stroke-dasharray="3 3" stroke-width="1"/><line x1="466" x2="401" y1="249" y2="288" stroke="#3A4048" stroke-dasharray="3 3" stroke-width="1"/><line x1="486" x2="546" y1="238" y2="240" stroke="#3A4048" stroke-dasharray="3 3" stroke-width="1"/><circle cx="306" cy="232" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/><text x="306" y="235.5" fill="#66F05A" class="mono" font-size="8" text-anchor="middle">MT</text><circle cx="392" cy="296" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/><text x="392" y="299.5" fill="#66F05A" class="mono" font-size="8" text-anchor="middle">MC</text><circle cx="474" cy="238" r="12" fill="#0B0D10" stroke="#66F05A" stroke-width="1"/><text x="474" y="241.5" fill="#66F05A" class="mono" font-size="8" text-anchor="middle">RN</text><rect width="94" height="22" x="344" y="222" fill="#F05AA6" fill-opacity=".15" stroke="#F05AA6" stroke-width="1" rx="4"/><text x="391" y="236.5" fill="#F05AA6" class="mono" font-size="9.5" text-anchor="middle">SHLB · 82 B</text><text x="392" y="366" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="middle">the 82-byte ShelbyPointer rides inside a normal protocol payload</text><text x="392" y="382" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="middle">unmodified nodes forward it untouched</text><line x1="552" x2="594" y1="240" y2="240" stroke="#66F05A" stroke-dasharray="5 4" stroke-width="1" marker-end="url(#aLime)"/><text x="573" y="226" fill="#F05AA6" class="mono" font-size="8.5" text-anchor="middle">POINTER</text><text x="573" y="256" fill="#8A93A0" class="mono" font-size="8.5" text-anchor="middle">82 B</text><rect width="158" height="164" x="600" y="158" fill="#F0F4EF" fill-opacity=".03" stroke="#8A93A0" stroke-width="1" rx="6"/><text x="679" y="186" fill="#F0F4EF" class="sans" font-size="12.5" font-weight="600" letter-spacing="2" text-anchor="middle">GATEWAY</text><text x="679" y="203" fill="#71D8DF" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">MESH-TO-IP BRIDGE</text><line x1="616" x2="742" y1="214" y2="214" stroke="#2A2F38" stroke-width="1"/><text x="679" y="236" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">any node with an IP path</text><text x="679" y="254" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">phone · base station</text><text x="679" y="272" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">resolves the pointer</text><text x="679" y="290" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">moves the actual bytes</text><rect width="72" height="24" x="758" y="228" fill="#71D8DF" fill-opacity=".1"/><line x1="763" x2="825" y1="240" y2="240" stroke="#71D8DF" stroke-width="2" marker-end="url(#aCyan)" marker-start="url(#aCyanL)"/><text x="794" y="220" fill="#71D8DF" class="mono" font-size="8.5" text-anchor="middle">IP LINK</text><text x="794" y="268" fill="#F0F4EF" class="mono" font-size="8.5" text-anchor="middle">FULL BLOB</text><text x="794" y="281" fill="#8A93A0" class="mono" font-size="8.5" text-anchor="middle">up to GB</text><rect width="182" height="180" x="830" y="150" fill="#71D8DF" fill-opacity=".05" stroke="#71D8DF" stroke-width="1" rx="6"/><text x="921" y="178" fill="#F0F4EF" class="sans" font-size="12.5" font-weight="600" letter-spacing="2" text-anchor="middle">SHELBY STORAGE</text><text x="921" y="195" fill="#71D8DF" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">BUILT ON APTOS</text><line x1="846" x2="996" y1="206" y2="206" stroke="#2A2F38" stroke-width="1"/><text x="921" y="228" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">content-addressed blobs</text><text x="921" y="246" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">paid reads · paid writes</text><text x="921" y="264" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">verifiable commitments</text><rect width="90" height="20" x="876" y="288" fill="none" stroke="#5A6270" stroke-width="1" rx="10"/><text x="921" y="301.5" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">PERSISTENT</text><line x1="1016" x2="1038" y1="240" y2="240" stroke="#71D8DF" stroke-width="1" marker-end="url(#aCyan)"/><text x="1028" y="258" fill="#8A93A0" class="mono" font-size="8" text-anchor="middle">reads</text><rect width="120" height="164" x="1044" y="158" fill="#F05AA6" fill-opacity=".05" stroke="#F05AA6" stroke-width="1" rx="6"/><text x="1104" y="186" fill="#F0F4EF" class="sans" font-size="12.5" font-weight="600" letter-spacing="2" text-anchor="middle">WEBAPP</text><text x="1104" y="203" fill="#F05AA6" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">LILYSHARK</text><line x1="1058" x2="1150" y1="214" y2="214" stroke="#2A2F38" stroke-width="1"/><text x="1104" y="236" fill="#A8B2BD" class="mono" font-size="9" text-anchor="middle">capture analysis</text><text x="1104" y="253" fill="#A8B2BD" class="mono" font-size="9" text-anchor="middle">Shelby network</text><text x="1104" y="270" fill="#A8B2BD" class="mono" font-size="9" text-anchor="middle">dashboard</text><rect width="620" height="112" x="36" y="452" fill="#F0B429" fill-opacity=".04" stroke="#F0B429" stroke-width="1" rx="6"/><text x="56" y="478" fill="#F0B429" class="sans" font-size="10" font-weight="600" letter-spacing="2">WHY A REFERENCE — MEASURED</text><text x="56" y="502" fill="#F0F4EF" class="mono" font-size="10.5">R = 7.36 TX per delivered message (Meshtastic discrete-event simulator)</text><text x="56" y="522" fill="#F0F4EF" class="mono" font-size="10.5">reach 68.6% → 25.8% as node density grows</text><text x="56" y="542" fill="#F0F4EF" class="mono" font-size="10.5">airtime is the scarce resource — send a reference, not a payload</text><rect width="476" height="112" x="688" y="452" fill="none" stroke="#2A2F38" stroke-width="1" rx="6"/><text x="708" y="478" fill="#8A93A0" class="sans" font-size="10" font-weight="600" letter-spacing="2">LEGEND</text><line x1="708" x2="758" y1="497" y2="497" stroke="#66F05A" stroke-dasharray="5 4" stroke-width="1"/><text x="770" y="500.5" fill="#A8B2BD" class="mono" font-size="9.5">LoRa RF — scarce shared airtime</text><line x1="708" x2="758" y1="519" y2="519" stroke="#71D8DF" stroke-width="2"/><text x="770" y="522.5" fill="#A8B2BD" class="mono" font-size="9.5">IP path — moves the full blob</text><rect width="50" height="14" x="708" y="534" fill="#F05AA6" fill-opacity=".15" stroke="#F05AA6" stroke-width="1" rx="3"/><text x="770" y="544.5" fill="#A8B2BD" class="mono" font-size="9.5">ShelbyPointer — 82-byte reference</text></svg>