<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="stackTitle" role="img" viewBox="0 0 1200 560"><title id="stackTitle">Open stack, bottom to top: LILYGO T-Deck hardware, open radio protocols, Lilyshark firmware, the Shelby pointer convention, Shelby storage on Aptos, and the Lilyshark webapp.</title><style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="1199" height="559" x=".5" y=".5" fill="#0B0D10" stroke="#252B33" rx="8"/><text x="36" y="42" fill="#F0F4EF" class="sans" font-size="17" font-weight="600" letter-spacing="3">OPEN STACK</text><text x="36" y="62" fill="#8A93A0" class="mono" font-size="11">hardware to application · every layer is open</text><text x="1164" y="42" fill="#F05AA6" class="mono" font-size="10" letter-spacing="2" text-anchor="end">LILYSHARK · SHELBY POINTER</text><line x1="36" x2="1164" y1="76" y2="76" stroke="#232830" stroke-width="1"/><rect width="1128" height="60" x="36" y="96" fill="#F05AA6" fill-opacity=".05" stroke="#F05AA6" stroke-width="1" rx="4"/><text x="56" y="121" fill="#F05AA6" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">APPLICATION</text><text x="56" y="141" fill="#A8B2BD" class="mono" font-size="10">Lilyshark webapp — capture analysis + Shelby network dashboard</text><rect width="104" height="24" x="1040" y="114" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1092" y="130" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OPEN SOURCE</text><rect width="1128" height="60" x="36" y="164" fill="#71D8DF" fill-opacity=".05" stroke="#71D8DF" stroke-width="1" rx="4"/><text x="56" y="189" fill="#71D8DF" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">STORAGE &amp; SETTLEMENT</text><text x="56" y="209" fill="#A8B2BD" class="mono" font-size="10">Shelby storage on Aptos — persistent blobs, paid reads and writes</text><rect width="112" height="24" x="1032" y="182" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1088" y="198" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OPEN NETWORK</text><rect width="1128" height="60" x="36" y="232" fill="#F0B429" fill-opacity=".05" stroke="#F0B429" stroke-width="1" rx="4"/><text x="56" y="257" fill="#F0B429" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">SHELBY POINTER CONVENTION</text><text x="56" y="277" fill="#A8B2BD" class="mono" font-size="10">82-byte payload convention — protocol-agnostic, rides inside any supported mesh payload</text><rect width="90" height="24" x="1054" y="250" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1099" y="266" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OPEN SPEC</text><rect width="1128" height="60" x="36" y="300" fill="#F05AA6" fill-opacity=".05" stroke="#F05AA6" stroke-width="1" rx="4"/><text x="56" y="325" fill="#F05AA6" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">LILYSHARK FIRMWARE</text><text x="56" y="345" fill="#A8B2BD" class="mono" font-size="10">capture · decode · spectrum · .lscap / LoRaTap PCAP export</text><rect width="76" height="24" x="1068" y="318" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1106" y="334" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">GPL-3.0</text><rect width="1128" height="60" x="36" y="368" fill="#66F05A" fill-opacity=".04" stroke="#66F05A" stroke-width="1" rx="4"/><text x="56" y="393" fill="#66F05A" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">RADIO PROTOCOLS</text><text x="56" y="413" fill="#A8B2BD" class="mono" font-size="10">Meshtastic / MeshCore / Reticulum-RNode — open mesh protocols, one capture engine</text><rect width="126" height="24" x="1018" y="386" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1081" y="402" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OPEN PROTOCOLS</text><rect width="1128" height="60" x="36" y="436" fill="#F0F4EF" fill-opacity=".03" stroke="#8A93A0" stroke-width="1" rx="4"/><text x="56" y="461" fill="#F0F4EF" class="sans" font-size="11.5" font-weight="600" letter-spacing="2">HARDWARE</text><text x="56" y="481" fill="#A8B2BD" class="mono" font-size="10">LILYGO T-Deck — ESP32-S3 + SX1262 · works on other Meshtastic-class boards with a screen</text><rect width="120" height="24" x="1024" y="454" fill="none" stroke="#5A6270" stroke-width="1" rx="12"/><text x="1084" y="470" fill="#8A93A0" class="mono" font-size="8.5" letter-spacing="1" text-anchor="middle">OPEN HARDWARE</text><text x="36" y="528" fill="#5A6270" class="mono" font-size="9.5">the pointer convention is the bridge — layers below it run off-grid on the device, layers above it run on the IP side</text></svg>