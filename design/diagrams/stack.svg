<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="stackTitle">
  <title id="stackTitle">Open stack, bottom to top: LILYGO T-Deck hardware, open radio protocols, Lilyshark firmware, the Shelby pointer convention, Shelby storage on Aptos, and the Lilyshark webapp.</title>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="559" rx="8" fill="#0B0D10" stroke="#252B33"/>

  <!-- header -->
  <text class="sans" x="36" y="42" font-size="17" font-weight="600" letter-spacing="3" fill="#F0F4EF">OPEN STACK</text>
  <text class="mono" x="36" y="62" font-size="11" fill="#8A93A0">hardware to application &#183; every layer is open</text>
  <text class="mono" x="1164" y="42" font-size="10" letter-spacing="2" fill="#F05AA6" text-anchor="end">LILYSHARK &#183; SHELBY POINTER</text>
  <line x1="36" y1="76" x2="1164" y2="76" stroke="#232830" stroke-width="1"/>

  <!-- application (top) -->
  <rect x="36" y="96" width="1128" height="60" rx="4" fill="#F05AA6" fill-opacity="0.05" stroke="#F05AA6" stroke-width="1"/>
  <text class="sans" x="56" y="121" font-size="11.5" font-weight="600" letter-spacing="2" fill="#F05AA6">APPLICATION</text>
  <text class="mono" x="56" y="141" font-size="10" fill="#A8B2BD">Lilyshark webapp &#8212; capture analysis + Shelby network dashboard</text>
  <rect x="1040" y="114" width="104" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1092" y="130" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OPEN SOURCE</text>

  <!-- storage & settlement -->
  <rect x="36" y="164" width="1128" height="60" rx="4" fill="#71D8DF" fill-opacity="0.05" stroke="#71D8DF" stroke-width="1"/>
  <text class="sans" x="56" y="189" font-size="11.5" font-weight="600" letter-spacing="2" fill="#71D8DF">STORAGE &amp; SETTLEMENT</text>
  <text class="mono" x="56" y="209" font-size="10" fill="#A8B2BD">Shelby storage on Aptos &#8212; persistent blobs, paid reads and writes</text>
  <rect x="1032" y="182" width="112" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1088" y="198" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OPEN NETWORK</text>

  <!-- shelby pointer convention -->
  <rect x="36" y="232" width="1128" height="60" rx="4" fill="#F0B429" fill-opacity="0.05" stroke="#F0B429" stroke-width="1"/>
  <text class="sans" x="56" y="257" font-size="11.5" font-weight="600" letter-spacing="2" fill="#F0B429">SHELBY POINTER CONVENTION</text>
  <text class="mono" x="56" y="277" font-size="10" fill="#A8B2BD">82-byte payload convention &#8212; protocol-agnostic, rides inside any supported mesh payload</text>
  <rect x="1054" y="250" width="90" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1099" y="266" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OPEN SPEC</text>

  <!-- lilyshark firmware -->
  <rect x="36" y="300" width="1128" height="60" rx="4" fill="#F05AA6" fill-opacity="0.05" stroke="#F05AA6" stroke-width="1"/>
  <text class="sans" x="56" y="325" font-size="11.5" font-weight="600" letter-spacing="2" fill="#F05AA6">LILYSHARK FIRMWARE</text>
  <text class="mono" x="56" y="345" font-size="10" fill="#A8B2BD">capture &#183; decode &#183; spectrum &#183; .lscap / LoRaTap PCAP export</text>
  <rect x="1068" y="318" width="76" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1106" y="334" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">GPL-3.0</text>

  <!-- radio protocols -->
  <rect x="36" y="368" width="1128" height="60" rx="4" fill="#66F05A" fill-opacity="0.04" stroke="#66F05A" stroke-width="1"/>
  <text class="sans" x="56" y="393" font-size="11.5" font-weight="600" letter-spacing="2" fill="#66F05A">RADIO PROTOCOLS</text>
  <text class="mono" x="56" y="413" font-size="10" fill="#A8B2BD">Meshtastic / MeshCore / Reticulum-RNode &#8212; open mesh protocols, one capture engine</text>
  <rect x="1018" y="386" width="126" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1081" y="402" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OPEN PROTOCOLS</text>

  <!-- hardware (bottom) -->
  <rect x="36" y="436" width="1128" height="60" rx="4" fill="#F0F4EF" fill-opacity="0.03" stroke="#8A93A0" stroke-width="1"/>
  <text class="sans" x="56" y="461" font-size="11.5" font-weight="600" letter-spacing="2" fill="#F0F4EF">HARDWARE</text>
  <text class="mono" x="56" y="481" font-size="10" fill="#A8B2BD">LILYGO T-Deck &#8212; ESP32-S3 + SX1262 &#183; works on other Meshtastic-class boards with a screen</text>
  <rect x="1024" y="454" width="120" height="24" rx="12" fill="none" stroke="#5A6270" stroke-width="1"/>
  <text class="mono" x="1084" y="470" font-size="8.5" letter-spacing="1" fill="#8A93A0" text-anchor="middle">OPEN HARDWARE</text>

  <!-- footer -->
  <text class="mono" x="36" y="528" font-size="9.5" fill="#5A6270">the pointer convention is the bridge &#8212; layers below it run off-grid on the device, layers above it run on the IP side</text>
</svg>
