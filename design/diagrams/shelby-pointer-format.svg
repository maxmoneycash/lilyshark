<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="fmtTitle" role="img" viewBox="0 0 1200 660"><title id="fmtTitle">ShelbyPointer 82-byte wire format: magic SHLB, version, flags, 32-byte blob commitment, 32-byte owner account address, blob size, expiry, chunk index, chunk count. Little-endian.</title><style>.sans{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="1199" height="659" x=".5" y=".5" fill="#0B0D10" stroke="#252B33" rx="8"/><text x="36" y="42" fill="#F0F4EF" class="sans" font-size="17" font-weight="600" letter-spacing="3">SHELBYPOINTER WIRE FORMAT</text><text x="36" y="62" fill="#8A93A0" class="mono" font-size="11">82 bytes · little-endian · magic &quot;SHLB&quot; · version 1 · rides inside a Meshtastic / MeshCore / Reticulum payload</text><text x="1164" y="42" fill="#F05AA6" class="mono" font-size="10" letter-spacing="2" text-anchor="end">LILYSHARK · SHELBY POINTER</text><line x1="36" x2="1164" y1="76" y2="76" stroke="#232830" stroke-width="1"/><text x="137" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+0</text><text x="203" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+1</text><text x="269" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+2</text><text x="335" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+3</text><text x="401" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+4</text><text x="467" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+5</text><text x="533" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+6</text><text x="599" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+7</text><text x="665" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+8</text><text x="731" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+9</text><text x="797" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+10</text><text x="863" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+11</text><text x="929" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+12</text><text x="995" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+13</text><text x="1061" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+14</text><text x="1127" y="112" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">+15</text><text x="92" y="151" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">0</text><text x="92" y="201" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">16</text><text x="92" y="251" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">32</text><text x="92" y="301" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">48</text><text x="92" y="351" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">64</text><text x="92" y="401" fill="#8A93A0" class="mono" font-size="9.5" text-anchor="end">80</text><text x="1168" y="151" fill="#5A6270" class="mono" font-size="9">15</text><text x="1168" y="201" fill="#5A6270" class="mono" font-size="9">31</text><text x="1168" y="251" fill="#5A6270" class="mono" font-size="9">47</text><text x="1168" y="301" fill="#5A6270" class="mono" font-size="9">63</text><text x="1168" y="351" fill="#5A6270" class="mono" font-size="9">79</text><rect width="264" height="50" x="104" y="122" fill="#F05AA6" fill-opacity=".1" stroke="#F05AA6" stroke-width="1"/><text x="112" y="138" fill="#F05AA6" class="sans" font-size="8.5" letter-spacing="1.2">MAGIC</text><text x="112" y="156" fill="#F0F4EF" class="mono" font-size="10.5">&quot;SHLB&quot; 53 48 4C 42</text><rect width="66" height="50" x="368" y="122" fill="#F0F4EF" fill-opacity=".04" stroke="#8A93A0" stroke-width="1"/><text x="401" y="138" fill="#8A93A0" class="sans" font-size="8.5" letter-spacing="1.2" text-anchor="middle">VER</text><text x="401" y="156" fill="#F0F4EF" class="mono" font-size="10.5" text-anchor="middle">1</text><rect width="66" height="50" x="434" y="122" fill="#F0B429" fill-opacity=".1" stroke="#F0B429" stroke-width="1"/><text x="467" y="138" fill="#F0B429" class="sans" font-size="8.5" letter-spacing="1.2" text-anchor="middle">FLAGS</text><text x="467" y="156" fill="#F0F4EF" class="mono" font-size="10.5" text-anchor="middle">b0..2</text><rect width="660" height="50" x="500" y="122" fill="#66F05A" fill-opacity=".08" stroke="#66F05A" stroke-width="1"/><text x="508" y="138" fill="#66F05A" class="sans" font-size="8.5" letter-spacing="1.2">BLOB COMMITMENT →</text><text x="508" y="156" fill="#A8B2BD" class="mono" font-size="9.5">starts @ 6</text><rect width="1056" height="50" x="104" y="172" fill="#66F05A" fill-opacity=".08" stroke="#66F05A" stroke-width="1"/><text x="632" y="194" fill="#66F05A" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">BLOB COMMITMENT</text><text x="632" y="211" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">32 bytes · bytes 6..37 · content commitment of the stored blob</text><rect width="396" height="50" x="104" y="222" fill="#66F05A" fill-opacity=".08" stroke="#66F05A" stroke-width="1"/><text x="112" y="238" fill="#66F05A" class="sans" font-size="8.5" letter-spacing="1.2">→ BLOB COMMITMENT</text><text x="112" y="256" fill="#A8B2BD" class="mono" font-size="9.5">ends @ 37</text><rect width="660" height="50" x="500" y="222" fill="#71D8DF" fill-opacity=".08" stroke="#71D8DF" stroke-width="1"/><text x="508" y="238" fill="#71D8DF" class="sans" font-size="8.5" letter-spacing="1.2">OWNER ACCOUNT ADDRESS →</text><text x="508" y="256" fill="#A8B2BD" class="mono" font-size="9.5">starts @ 38</text><rect width="1056" height="50" x="104" y="272" fill="#71D8DF" fill-opacity=".08" stroke="#71D8DF" stroke-width="1"/><text x="632" y="294" fill="#71D8DF" class="sans" font-size="9" letter-spacing="1.5" text-anchor="middle">OWNER ACCOUNT ADDRESS</text><text x="632" y="311" fill="#A8B2BD" class="mono" font-size="9.5" text-anchor="middle">32 bytes · bytes 38..69 · account that owns and pays for the blob</text><rect width="396" height="50" x="104" y="322" fill="#71D8DF" fill-opacity=".08" stroke="#71D8DF" stroke-width="1"/><text x="112" y="338" fill="#71D8DF" class="sans" font-size="8.5" letter-spacing="1.2">→ OWNER ACCOUNT ADDRESS</text><text x="112" y="356" fill="#A8B2BD" class="mono" font-size="9.5">ends @ 69</text><rect width="264" height="50" x="500" y="322" fill="#F0F4EF" fill-opacity=".04" stroke="#8A93A0" stroke-width="1"/><text x="508" y="338" fill="#8A93A0" class="sans" font-size="8.5" letter-spacing="1.2">BLOB SIZE</text><text x="508" y="356" fill="#F0F4EF" class="mono" font-size="9.5">u32 LE · bytes 70..73</text><rect width="264" height="50" x="764" y="322" fill="#F0F4EF" fill-opacity=".04" stroke="#8A93A0" stroke-width="1"/><text x="772" y="338" fill="#8A93A0" class="sans" font-size="8.5" letter-spacing="1.2">EXPIRY</text><text x="772" y="356" fill="#F0F4EF" class="mono" font-size="9.5">u32 LE · unix s · 74..77</text><rect width="132" height="50" x="1028" y="322" fill="#F0F4EF" fill-opacity=".04" stroke="#8A93A0" stroke-width="1"/><text x="1094" y="338" fill="#8A93A0" class="sans" font-size="8.5" letter-spacing="1.2" text-anchor="middle">CHUNK IDX</text><text x="1094" y="356" fill="#F0F4EF" class="mono" font-size="9.5" text-anchor="middle">u16 LE · 78..79</text><rect width="132" height="50" x="104" y="372" fill="#F0F4EF" fill-opacity=".04" stroke="#8A93A0" stroke-width="1"/><text x="170" y="388" fill="#8A93A0" class="sans" font-size="8.5" letter-spacing="1.2" text-anchor="middle">CHUNK CNT</text><text x="170" y="406" fill="#F0F4EF" class="mono" font-size="9.5" text-anchor="middle">u16 LE · 80..81</text><rect width="924" height="50" x="236" y="372" fill="none" stroke="#3A4048" stroke-dasharray="4 4" stroke-width="1"/><text x="698" y="401" fill="#5A6270" class="mono" font-size="9.5" text-anchor="middle">end of pointer · 82 bytes total · remaining frame bytes belong to the host protocol</text><text x="104" y="470" fill="#F0B429" class="sans" font-size="10" font-weight="600" letter-spacing="2">FLAGS — BYTE 5</text><rect width="44" height="36" x="104" y="482" fill="none" stroke="#3A4048" stroke-width="1"/><text x="126" y="504" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">0</text><rect width="44" height="36" x="148" y="482" fill="none" stroke="#3A4048" stroke-width="1"/><text x="170" y="504" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">0</text><rect width="44" height="36" x="192" y="482" fill="none" stroke="#3A4048" stroke-width="1"/><text x="214" y="504" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">0</text><rect width="44" height="36" x="236" y="482" fill="none" stroke="#3A4048" stroke-width="1"/><text x="258" y="504" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">0</text><rect width="44" height="36" x="280" y="482" fill="none" stroke="#3A4048" stroke-width="1"/><text x="302" y="504" fill="#5A6270" class="mono" font-size="9" text-anchor="middle">0</text><rect width="44" height="36" x="324" y="482" fill="#F0B429" fill-opacity=".1" stroke="#F0B429" stroke-width="1"/><text x="346" y="504" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">CAP</text><rect width="44" height="36" x="368" y="482" fill="#F0B429" fill-opacity=".1" stroke="#F0B429" stroke-width="1"/><text x="390" y="504" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">CHK</text><rect width="44" height="36" x="412" y="482" fill="#F0B429" fill-opacity=".1" stroke="#F0B429" stroke-width="1"/><text x="434" y="504" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">ENC</text><text x="126" y="532" fill="#5A6270" class="mono" font-size="8.5" text-anchor="middle">b7</text><text x="170" y="532" fill="#5A6270" class="mono" font-size="8.5" text-anchor="middle">b6</text><text x="214" y="532" fill="#5A6270" class="mono" font-size="8.5" text-anchor="middle">b5</text><text x="258" y="532" fill="#5A6270" class="mono" font-size="8.5" text-anchor="middle">b4</text><text x="302" y="532" fill="#5A6270" class="mono" font-size="8.5" text-anchor="middle">b3</text><text x="346" y="532" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">b2</text><text x="390" y="532" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">b1</text><text x="434" y="532" fill="#F0B429" class="mono" font-size="8.5" text-anchor="middle">b0</text><text x="560" y="494" fill="#A8B2BD" class="mono" font-size="10">b0 ENCRYPTED — blob encrypted with the channel key (firmware never holds it)</text><text x="560" y="512" fill="#A8B2BD" class="mono" font-size="10">b1 CHUNKED — this pointer is one part of a multi-frame set</text><text x="560" y="530" fill="#A8B2BD" class="mono" font-size="10">b2 CAPTURE — blob is a Lilyshark .lscap capture, not user content</text><text x="560" y="548" fill="#5A6270" class="mono" font-size="10">b3..b7 reserved — must be 0</text><line x1="36" x2="1164" y1="576" y2="576" stroke="#232830" stroke-width="1"/><text x="36" y="600" fill="#8A93A0" class="mono" font-size="10">82 bytes fits one LoRa frame (~200 practical payload bytes in Meshtastic) with headroom for the</text><text x="36" y="618" fill="#8A93A0" class="mono" font-size="10">enclosing protocol header. All multi-byte integers are little-endian.</text></svg>