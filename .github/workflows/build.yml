name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*-alpha*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webapp:
    # The analyzer is half the product and now carries the net relay; a
    # regression here used to merge green because CI never ran it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The pin lives in webapp/package.json; the action defaults to the
          # repository root, where there is no package.json at all.
          package_json_file: webapp/package.json

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: webapp
        run: pnpm test

      - name: Build
        working-directory: webapp
        run: pnpm run build

  ios:
    # COST: this is the only job here that needs a macOS runner, and GitHub bills
    # GitHub-hosted macOS minutes at 10x the Linux rate. On a public repository
    # that is free; on a private one this job alone drains the included allowance
    # ten times faster than the ubuntu jobs above, which is why it is scoped to
    # the two checks that would actually have caught a regression -- the
    # simulator app compiling, and MeshtasticKit's framing tests -- and not to
    # the macOS or watch targets.
    #
    # The watch target is deliberately absent. It cannot be built from this
    # checkout at all: it references PommeCoreWatchKit, a private upstream
    # package that was never vendored here. ios/BUILD.md records the evidence.
    #
    # Nothing in the release path depends on this job. publish-alpha still gates
    # on the firmware jobs only, so a broken app build cannot block a firmware
    # release, and a green firmware release does not imply the app compiles.
    # macos-26, not macos-15. The widget extension sets
    # IPHONEOS_DEPLOYMENT_TARGET = 26.4, and `xcodebuild -scheme PommeCore`
    # builds it. The macos-15 image defaults to Xcode 16.4 / iOS 18.5, five
    # majors below that -- and Xcode treats a deployment target above its SDK
    # as a WARNING, so this job was going green while compiling the widget
    # against a system it had no headers for. The earlier justification for
    # macos-15 checked only the three Swift PACKAGE floors and never read the
    # Xcode project.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record the toolchain this run actually used
        # Verified locally on Xcode 26.6 with the iOS 26.5 runtime. When this
        # job fails for a reason that reproduces nowhere else, read this first.
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Refuse an SDK older than the project's own targets
        # The guard, not the comment above, is what keeps this honest: a runner
        # image can change its default Xcode without anyone here noticing, and
        # the failure that causes is a silent warning rather than a red build.
        run: python3 scripts/check_ios_toolchain.py

      - name: Build the iOS simulator app
        run: ./scripts/build_ios.sh

      - name: Test MeshtasticKit
        working-directory: ios/Packages/MeshtasticKit
        run: swift test

      - name: Upload the Xcode log when the build fails
        # build_ios.sh prints only the deduplicated errors and the last 40 lines;
        # a CI-only failure usually needs the rest of the log to diagnose.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log-${{ github.sha }}
          path: ios/DerivedData/build_ios.log
          if-no-files-found: ignore
          retention-days: 14

  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned build runner
        run: python3 -m pip install uv==0.11.22

      - name: Install simulator build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsdl2-dev
          sdl2-config --version

      - name: Adapt the simulator target for Linux
        run: sed -i '/^[[:space:]]*-arch x86_64$/d' platformio.ini

      - name: Test and build every release surface
        run: ./scripts/test_all.sh

      - name: Verify reproducible release artifacts
        run: ./scripts/verify_reproducible_release.sh

      - name: Upload T-Deck firmware
        uses: actions/upload-artifact@v7
        with:
          name: lilyshark-tdeck-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    needs: test-and-build
    runs-on: ubuntu-24.04

    steps:
      - name: Download staged firmware
        uses: actions/download-artifact@v8
        with:
          name: lilyshark-tdeck-${{ github.sha }}
          path: dist

      - name: Verify staged firmware checksums
        run: cd dist && sha256sum --check SHA256SUMS

  publish-alpha:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-and-build, verify-artifact]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: lilyshark-tdeck-${{ github.sha }}
          path: dist

      - name: Publish durable developer-alpha download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Lilyshark developer-alpha firmware for the original LILYGO T-Deck.

          This build has passed the sanitizer-backed host suite, exact 320x240 checks for all analyzer and product-shell routes, the pinned ESP32-S3 build, and byte-level factory-image validation. It has not yet completed the physical T-Deck smoke test, so treat it as test firmware and report the first-boot serial log.

          Alpha.7 turns the analyzer views into a complete device product. The first visible application frame is the antialiased Lily Pink wordmark. A six-stage first run explains the diagnostic tools, selects the mesh family and radio preset, teaches the controls, reports actual hardware readiness, and persists completion only after a verified settings write. Home, Settings, radio profiles, capture and storage controls, device status, display and input controls, Help, About, guarded spectrum start, and guarded setup reset are all reachable on the T-Deck.

          App settings use a CRC-checked record. Failed writes roll values and runtime state back instead of reporting success. The Events feed records real system, radio, profile, capture, storage, spectrum, screenshot, survey, and hardware actions in a bounded scrollable history. Packet Detail has PKT, RF, DEC, HEX, and RAW tabs; HEX pages through every captured byte. Traffic Filter composes protocol, decode-state, and CRC predicates without changing capture files. Protocol Detail hands a selected class into that filter. Spectrum offers fast active-channel and deep regional sweeps with explicit receive pause and restoration. Capture can be stopped, restarted, or retried from the UI, and optional GPS restarts discard stale session data.

          The device-shell test executes the real setup and loop through peripheral fakes. It proves the logo is flushed before the backlight turns on, completes all six onboarding stages, traverses every shell route and analyzer view, injects a 95-byte radio frame through decoding and both capture writers, exercises all five packet tabs and bounded HEX pages, filters Traffic through Protocol Detail, opens full event messages, and covers missing hardware plus persistence and storage failures. Exact render tests cover all 13 analyzer routes and 17 shell routes; a separate region-based test proves visible motion on every live diagnostic view. The alpha.6 panel-init and SPI2 fixes remain in place. Physical panel, input, radio, GPS, and microSD behavior still require the documented hardware smoke test.

          - Flash `lilyshark-tdeck.factory.bin` at `0x0` for a fresh install.
          - Use `lilyshark-tdeck.bin` at `0x10000` only with the matching Lilyshark bootloader and partition table.
          - Verify downloads with `SHA256SUMS`.
          - Keep `lilyshark-tdeck.elf` for crash-symbol decoding; do not flash it.

          Read the [flashing guide](https://github.com/maxmoneycash/lilyshark/blob/__RELEASE_TAG__/docs/FLASHING.md) before installing.
          EOF
          sed -i "s/__RELEASE_TAG__/${GITHUB_REF_NAME}/g" release-notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lilyshark ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
